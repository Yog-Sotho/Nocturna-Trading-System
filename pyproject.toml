# FILE LOCATION: pyproject.toml (project root)
[project]
name = "nocturna-trading-system"
version = "2.0.0"
description = "Event-driven algorithmic trading framework (paper trading only)"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "src/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (Flask patterns)
    "SIM108", # ternary operator
]

[tool.ruff.lint.per-file-ignores]
"src/tests/*" = ["S101"]  # allow assert in tests

[tool.bandit]
exclude_dirs = ["src/tests", "venv", ".venv"]
skips = ["B101"]  # assert used in non-test code for guards

# The trading core is checked strictly; the modules it imports (models, config,
# Flask glue) are type-checked only where the core uses them.
[tool.mypy]
python_version = "3.13"
files = ["src/trading", "src/models/trading.py"]
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.trading.*", "src.models.trading"]
strict = true

[[tool.mypy.overrides]]
module = ["src.models.user", "src.utils.*", "src.config"]
ignore_errors = true

[tool.black]
line-length = 120
target-version = ["py313"]
