# FILE LOCATION: .github/workflows/ci.yml
name: Nocturna CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# No job writes to the repository; the token only needs to read it for checkout
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src/ tools/ --output-format=github

      # Strict on the trading core and its models (pyproject.toml [tool.mypy])
      - name: Type check
        run: mypy

      # Blocking: any finding of medium severity and confidence or above fails the build
      - name: Bandit security scan
        run: bandit -r src/ -c pyproject.toml --severity-level medium --confidence-level medium

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.10,<3"

      # Any known advisory in a locked dependency fails the build
      - name: Audit locked dependencies
        run: |
          pip-audit -r requirements-dev.txt --disable-pip --no-deps --progress-spinner off
          pip-audit -r requirements-mutation.txt --disable-pip --no-deps --progress-spinner off

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        # Same major version as docker-compose.yml
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nocturna
          POSTGRES_PASSWORD: nocturna-ci
          POSTGRES_DB: nocturna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nocturna -d nocturna_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Run tests
        env:
          FLASK_ENV: testing
          FLASK_SECRET_KEY: ci-test-secret-key-not-for-production-use-1234567890
          REDIS_URL: redis://localhost:6379/0
          # Migration tests also run against PostgreSQL (src/tests/test_migrations.py)
          TEST_POSTGRES_URL: postgresql+psycopg://nocturna:nocturna-ci@localhost:5432/nocturna_test
          TRADING_MODE: PAPER
        run: |
          pytest src/tests/ -v --tb=short --cov=src --cov-report=term-missing \
            --cov-report=json:coverage.json --cov-fail-under=94

      # The modules that move money or decide risk keep a higher floor
      - name: Core coverage gate
        run: python tools/coverage_gate.py coverage.json

  # The dashboard in Chromium at phone size, against the app with a simulated engine
  dashboard:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Drive the dashboard
        run: |
          python tools/dashboard/serve_sim.py . "$RUNNER_TEMP/dashboard.db" 5055 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5055/health > /dev/null && break; sleep 1; done
          node tools/dashboard/e2e.cjs "$RUNNER_TEMP/screenshots"

      - name: Keep the screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/server.log
          if-no-files-found: ignore

  # The production image and the Compose stack, without any broker account
  image:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: A throwaway configuration
        run: |
          {
            for name in FLASK_SECRET_KEY JWT_SECRET_KEY API_KEY_PEPPER; do echo "$name=$(openssl rand -hex 32)"; done
            for name in DB_PASSWORD REDIS_PASSWORD; do echo "$name=$(openssl rand -hex 16)"; done
            echo "ALLOWED_ORIGINS=https://ci.example"
          } > .env

      - name: The Compose file is valid, with and without the proxy profile
        run: |
          docker compose config --quiet
          DOMAIN=ci.example docker compose --profile proxy config --quiet

      - name: Build the production image
        run: docker compose build api

      - name: The image holds no secrets, history, local data or tests
        run: |
          docker run --rm --entrypoint sh nocturna:latest -c '
            for p in /app/.git /app/.env /app/src/tests /app/docs /app/reports /app/logs/nocturna.log; do
              if [ -e "$p" ]; then echo "$p is in the image"; exit 1; fi
            done
            if touch /app/src/main.py 2>/dev/null; then echo "the app user can change the code"; exit 1; fi'

      - name: The stack starts healthy
        run: |
          docker compose up -d --wait --wait-timeout 240 api engine
          curl -sf http://127.0.0.1:5000/ready
          curl -sf http://127.0.0.1:5000/api/v1/trading/health

      - name: Logs
        if: always()
        run: docker compose logs --no-color api engine | tail -200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
