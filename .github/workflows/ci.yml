# FILE LOCATION: .github/workflows/ci.yml
name: Nocturna CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src/ --output-format=github

      - name: Bandit security scan
        run: bandit -r src/ -c pyproject.toml --severity-level medium -f json || true

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.10,<3"

      # The ignored advisories affect urllib3 1.26.x and msgpack 1.0.3, which are pinned by
      # alpaca-trade-api (archived June 2026). It is removed in Phase 2 together with these
      # ignores; see docs/ROADMAP.md. Any other advisory fails the build.
      - name: Audit locked dependencies
        run: |
          pip-audit -r requirements-dev.txt --disable-pip --no-deps --progress-spinner off \
            --ignore-vuln PYSEC-2026-141 \
            --ignore-vuln PYSEC-2026-1994 \
            --ignore-vuln PYSEC-2026-1996 \
            --ignore-vuln PYSEC-2026-1998 \
            --ignore-vuln PYSEC-2026-1999 \
            --ignore-vuln PYSEC-2026-4175 \
            --ignore-vuln PYSEC-2026-4177 \
            --ignore-vuln PYSEC-2026-3625

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Run tests
        env:
          FLASK_ENV: testing
          FLASK_SECRET_KEY: ci-test-secret-key-not-for-production-use-1234567890
          REDIS_URL: redis://localhost:6379/0
          TRADING_MODE: PAPER
        run: |
          pytest src/tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=40
