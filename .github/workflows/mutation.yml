# Mutation testing of the risk code (tools/mutation/): Cosmic Ray changes
# risk.py and sizing.py one operator at a time and runs the risk tests; a
# change the tests do not notice "survives". Too slow for every push, so it
# runs weekly, on demand, and on pull requests that touch the risk code.
name: Mutation testing

on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/trading/risk.py
      - src/trading/sizing.py
      - src/tests/test_trading_risk.py
      - tools/mutation/**
      - requirements-mutation.txt
      - .github/workflows/mutation.yml

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        module: [src/trading/risk.py, src/trading/sizing.py]
    env:
      MODULE: ${{ matrix.module }}
      FLASK_ENV: testing
      TRADING_MODE: PAPER
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-mutation.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-mutation.txt

      - name: Mutate the module
        run: |
          sed -i "s|^module-path = .*|module-path = [\"$MODULE\"]|" tools/mutation/cosmic-ray.toml
          cosmic-ray init tools/mutation/cosmic-ray.toml mutation.sqlite
          cr-filter-operators mutation.sqlite tools/mutation/cosmic-ray.toml
          cr-filter-pragma mutation.sqlite
          cosmic-ray baseline tools/mutation/cosmic-ray.toml
          cosmic-ray exec tools/mutation/cosmic-ray.toml mutation.sqlite

      - name: Survivors and score
        run: cosmic-ray dump mutation.sqlite | python tools/mutation/gate.py --max-survival 3

      - name: Keep the session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ strategy.job-index }}
          path: mutation.sqlite
          if-no-files-found: ignore
